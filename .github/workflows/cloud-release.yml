name: Cloud and connector release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-plugin:
    uses: ./.github/workflows/hermes-plugin-compatibility.yml

  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: agent_control_validation
          POSTGRES_USER: agent_control_test
          POSTGRES_PASSWORD: local_ci_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_control_test -d agent_control_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e packages/hermes-client -e 'apps/api[test]' -e 'apps/mock-hermes[test]' -e packages/connector
      - run: npm ci
      - run: npm ci --prefix design/prototypes/mobile-option-2
      - run: make test build
        env:
          AGENT_CONTROL_TEST_POSTGRES_URL: postgresql+psycopg://agent_control_test:local_ci_validation@127.0.0.1:5432/agent_control_validation

  connector:
    needs: [verify, hermes-plugin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./packages/hermes-client ./packages/connector pyinstaller==6.22.3 'pytest>=8.3,<9' 'cryptography>=44,<47'
      - run: python -m pytest -q tests/connector/test_native_lifecycle.py tests/connector/test_management.py tests/connector/test_storage.py tests/connector/test_pairing_credentials.py
      - run: python deploy/connector/build.py --output dist/native --revision "$GITHUB_SHA"
      - name: Verify the bundled native lifecycle
        env:
          AGENT_CONTROL_CONNECTOR_ARCHIVE: dist/native/agent-control-connector-${{ matrix.platform }}.tar.gz
        run: python -m pytest -q tests/connector/test_native_lifecycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: connector-${{ matrix.platform }}
          path: dist/native/*.tar.gz
          if-no-files-found: error

  mail-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e --workspace @hermes-control/web -- mail-plugins.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mail-browser-results
          path: test-results/playwright

  image:
    needs: [verify, hermes-plugin, mail-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ghcr.io/jrterven/agent-control:${{ github.sha }}
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'ghcr.io/jrterven/agent-control@%s\n' "$DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-image-digest
          path: image-digest.txt
