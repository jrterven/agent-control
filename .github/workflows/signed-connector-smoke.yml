name: Signed macOS connector verification

on:
  workflow_dispatch:
    inputs:
      draft_release_tag:
        description: Temporary draft release containing the signed macOS archives
        required: true
        type: string
      expected_revision:
        description: Full lowercase commit SHA used to build the release
        required: true
        type: string
      expected_team_id:
        description: Ten-character Apple Developer Team ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    name: Read signed archives from the draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub requires push access to read a draft release. Keep that token in
    # this download-only job; no repository or downloaded code is executed here.
    permissions:
      contents: write
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      EXPECTED_TEAM_ID: ${{ inputs.expected_team_id }}
      DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$EXPECTED_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || exit 1
          [[ "$DRAFT_RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,100}$ ]] || exit 1
      - name: Download both unpublished signed archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/signed-connector"
          gh release view "$DRAFT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName > "$RUNNER_TEMP/signed-connector/draft.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'signed-connector/draft.json').read_text())
          assert release['isDraft'] is True, 'Refusing to verify a published release through this staging workflow'
          assert release['tagName'] == os.environ['DRAFT_RELEASE_TAG'], 'Unexpected release tag'
          PY
          for architecture in arm64 x86_64; do
            gh release download "$DRAFT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "agent-control-connector-macos-$architecture.tar.gz" \
              --dir "$RUNNER_TEMP/signed-connector"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-connector-inputs
          path: |
            ${{ runner.temp }}/signed-connector/agent-control-connector-macos-arm64.tar.gz
            ${{ runner.temp }}/signed-connector/agent-control-connector-macos-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 3
  verify:
    name: Signed connector (${{ matrix.architecture }})
    needs: download
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-14
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      EXPECTED_TEAM_ID: ${{ inputs.expected_team_id }}
      DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$EXPECTED_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || exit 1
          [[ "$DRAFT_RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,100}$ ]] || exit 1
          printf 'AGENT_CONTROL_CONNECTOR_ARCHIVE=%s/signed-connector/agent-control-connector-macos-%s.tar.gz\n' "$RUNNER_TEMP" "$ARCHITECTURE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_revision }}
          persist-credentials: false
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: signed-connector-inputs
          path: ${{ runner.temp }}/signed-connector
      - name: Verify every delivered code signature and Apple notarization
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python deploy/connector/verify_macos_archive.py \
            --archive "$AGENT_CONTROL_CONNECTOR_ARCHIVE" \
            --revision "$EXPECTED_REVISION" --team "$EXPECTED_TEAM_ID" \
            --architecture "$ARCHITECTURE" \
            --report "$RUNNER_TEMP/signed-connector/signature-verification.json"
      - name: Install test dependencies from the exact release revision
        run: python -m pip install ./packages/hermes-client ./packages/connector 'pytest>=8.3,<9' 'cryptography>=44,<47'
      - name: Run isolated native lifecycle checks on the signed archive
        # Tests use temporary unpaired data directories and a stand-in worker;
        # they never register launchctl services, start Hermes or access real credentials.
        run: |
          python -m pytest -q tests/connector/test_native_lifecycle.py \
            --junitxml "$RUNNER_TEMP/signed-connector/native-lifecycle.xml"
      - name: Confirm the tested archive still matches its verification report
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'signed-connector'
          report = json.loads((root / 'signature-verification.json').read_text())
          with Path(os.environ['AGENT_CONTROL_CONNECTOR_ARCHIVE']).open('rb') as archive:
              assert hashlib.file_digest(archive, 'sha256').hexdigest() == report['sha256'], 'Archive changed during tests'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-connector-verification-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/signed-connector/signature-verification.json
            ${{ runner.temp }}/signed-connector/native-lifecycle.xml
          if-no-files-found: warn
