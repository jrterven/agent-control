[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-control-mock-hermes"
version = "0.1.0"
description = "Deterministic Hermes dashboard and API-server mock for Hermes Control"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[project.scripts]
mock-hermes = "mock_hermes.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_hermes"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../../tests/mock"]
