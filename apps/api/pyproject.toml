[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-control-api"
version = "0.1.0"
description = "Backend security boundary for Agent Control"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "hermes-control-client>=0.1.0",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=25,<26",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
hermes-control-api = "hermes_control_api.main:run"
hermes-control-admin = "hermes_control_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hermes_control_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
